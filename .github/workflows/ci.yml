name: CI - Development Validation

on:
  push:
    branches:
      - development
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"

  pull_request:
    branches:
      - development
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.svg"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHON_VERSION: "3.11"

  MODEL_BUCKET: ${{ secrets.MODEL_BUCKET }}
  DATA_URI: ${{ secrets.DATA_URI }}
  TEXT_COL: ${{ secrets.TEXT_COL }}
  LABEL_COL: ${{ secrets.LABEL_COL }}
  MIN_F1_SCORE: 0.60

concurrency:
  group: ci-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Run Code Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install quality tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8

      - name: Run Black format check
        run: |
          black --check src tests

      - name: Run Flake8 lint check
        run: |
          flake8 src tests

  unit-test:
    name: Run API Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Show Python version
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          python -m pytest tests/ --cov=src.api --cov-report=term-missing --cov-fail-under=80

  security-check:
    name: Run Dependency Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run dependency audit
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/pip_audit.json

      - name: Upload security audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-audit-report
          path: reports/pip_audit.json
          retention-days: 7

  train-candidate-model:
    name: Train and Upload Candidate Model
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - quality-check
      - unit-test
      - security-check

    # Training dan upload model hanya dilakukan saat push/manual run,
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Show tool versions
        run: |
          python --version
          pip --version
          gcloud --version

      - name: Validate required environment variables
        run: |
          required_vars=("MODEL_BUCKET" "DATA_URI" "TEXT_COL" "LABEL_COL" "MIN_F1_SCORE")

          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "Missing required environment variable: $var"
              exit 1
            fi
          done

          echo "All required environment variables are set."

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-train.txt

      - name: Prepare directories
        run: |
          mkdir -p data
          mkdir -p model
          mkdir -p reports

      - name: Download training dataset from Cloud Storage
        run: |
          echo "Downloading dataset from Cloud Storage..."
          gcloud storage cp "$DATA_URI" data/train.csv
          echo "Dataset downloaded to data/train.csv"

      - name: Train candidate model
        run: |
          python src/train.py \
            --data data/train.csv \
            --model-out model/pipeline.pkl \
            --metrics-out reports/metrics.json \
            --text-col "$TEXT_COL" \
            --label-col "$LABEL_COL"

      - name: Validate model metric gate
        run: |
          python scripts/validate_model.py

      - name: Compare with current best candidate model
        id: compare
        run: |
          python scripts/compare_model.py

      - name: Upload versioned candidate model
        run: |
          echo "Uploading versioned candidate model..."
          gcloud storage cp model/pipeline.pkl \
            "gs://${MODEL_BUCKET}/models/candidate/${GITHUB_SHA}/pipeline.pkl"

          gcloud storage cp reports/metrics.json \
            "gs://${MODEL_BUCKET}/reports/candidate/${GITHUB_SHA}/metrics.json"

          echo "Versioned candidate model uploaded using commit SHA: ${GITHUB_SHA}"

      - name: Update best candidate model
        if: steps.compare.outputs.is_best == 'true'
        run: |
          echo "Updating candidate/best model..."
          gcloud storage cp model/pipeline.pkl \
            "gs://${MODEL_BUCKET}/models/candidate/best/pipeline.pkl"

          gcloud storage cp reports/metrics.json \
            "gs://${MODEL_BUCKET}/reports/candidate/best/metrics.json"

          echo "candidate/best has been updated."

      - name: Keep existing best candidate model
        if: steps.compare.outputs.is_best == 'false'
        run: |
          echo "New model is not better than the current best candidate."
          echo "candidate/best is not updated."

      - name: Upload training reports as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-training-reports
          path: reports/
          retention-days: 7

      - name: Upload MLflow experiment runs as GitHub artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-mlflow-runs
          path: mlruns/
          retention-days: 30
          
  ci-summary:
      name: Generate CI Summary
      runs-on: ubuntu-latest
      needs:
        - unit-test
        - security-check
        - train-candidate-model
      if: always()

      steps:
        - name: Write CI summary
          run: |
            echo "## CI Result" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Unit test job: \`${{ needs.unit-test.result }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Security check job: \`${{ needs.security-check.result }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Train candidate model job: \`${{ needs.train-candidate-model.result }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "This CI validates API tests, dependency security check, candidate model training, F1 metric gate, and model artifact upload to Cloud Storage." >> $GITHUB_STEP_SUMMARY