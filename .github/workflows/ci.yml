name: CI - Development Validation

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  MODEL_BUCKET: ${{ secrets.MODEL_BUCKET }}
  DATA_URI: ${{ secrets.DATA_URI }}
  TEXT_COL: ${{ secrets.TEXT_COL }}
  LABEL_COL: ${{ secrets.LABEL_COL }}
  MIN_F1_SCORE: ${{ secrets.F1_THRESHOLD }}

jobs:
  unit-test:
    name: Run API Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v

  security-check:
    name: Run Dependency Security Check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run dependency audit
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/pip_audit.json || true

      - name: Upload security audit report
        uses: actions/upload-artifact@v4
        with:
          name: ci-security-audit-report
          path: reports/pip_audit.json

  train-candidate-model:
    name: Train and Upload Candidate Model
    runs-on: ubuntu-latest
    needs:
      - unit-test

    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set active GCP project
        run: |
          gcloud config set project "$GCP_PROJECT_ID"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare directories
        run: |
          mkdir -p data
          mkdir -p model
          mkdir -p reports

      - name: Download training dataset from Cloud Storage
        run: |
          echo "Downloading dataset from: $DATA_URI"
          gcloud storage cp "$DATA_URI" data/train.csv

      - name: Train candidate model
        run: |
          python src/train.py \
            --data data/train.csv \
            --model-out model/pipeline.pkl \
            --metrics-out reports/metrics.json \
            --text-col "$TEXT_COL" \
            --label-col "$LABEL_COL"

      - name: Validate model metric gate
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          metrics_path = "reports/metrics.json"
          min_f1 = float(os.getenv("MIN_F1_SCORE"))

          with open(metrics_path, "r", encoding="utf-8") as f:
              metrics = json.load(f)

          f1 = float(metrics.get("f1_weighted", 0))

          print(f"F1 score: {f1}")
          print(f"Minimum required F1 score: {min_f1}")

          if f1 < min_f1:
              print("Model failed the metric gate.")
              sys.exit(1)

          print("Model passed the metric gate.")
          PY

      # add compare step to check if the new model is better than the current best model in GCS
      - name: Compare with current best model
        id: compare
        run: |
          python - <<'PY'
          import json
          import os

          current_f1 = 0.0

          result = os.system(
              f'gcloud storage cp gs://{os.environ["MODEL_BUCKET"]}/reports/candidate/best/metrics.json current_metrics.json'
          )

          if result == 0:
              with open("current_metrics.json") as f:
                  current_f1 = json.load(f).get("f1_weighted", 0)
          else:
              print("No previous best model found.")

          with open("reports/metrics.json") as f:
              new_f1 = json.load(f).get("f1_weighted", 0)

          print(f"Current best F1: {current_f1}")
          print(f"New model F1: {new_f1}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"is_best={'true' if new_f1 > current_f1 else 'false'}\n")
          PY

      - name: Upload versioned model
        run: |
          gcloud storage cp model/pipeline.pkl \
            "gs://${MODEL_BUCKET}/models/candidate/${GITHUB_SHA}/pipeline.pkl"

          gcloud storage cp reports/metrics.json \
            "gs://${MODEL_BUCKET}/reports/candidate/${GITHUB_SHA}/metrics.json"

      - name: Update best model
        if: steps.compare.outputs.is_best == 'true'
        run: |
          gcloud storage cp model/pipeline.pkl \
            "gs://${MODEL_BUCKET}/models/candidate/best/pipeline.pkl"

          gcloud storage cp reports/metrics.json \
            "gs://${MODEL_BUCKET}/reports/candidate/best/metrics.json"

      - name: Upload training reports as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-training-reports
          path: reports/