name: Production Deployment

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  MODEL_BUCKET: ${{ secrets.MODEL_BUCKET }}
  DATA_URI: ${{ secrets.DATA_URI }}
  TEXT_COL: ${{ secrets.TEXT_COL }}
  LABEL_COL: ${{ secrets.LABEL_COL }}
  MIN_F1_SCORE: ${{ secrets.F1_THRESHOLD }}
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  AR_REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

jobs:
  deploy-production:
    name: Build Docker and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set active GCP project
        run: |
          gcloud config set project "$GCP_PROJECT_ID"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Define Docker image URI
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "Docker image URI: ${IMAGE_URI}"

      - name: Build Docker image
        run: |
          docker build -t "$IMAGE_URI" .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE_URI" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "MODEL_GCS_URI=gs://${MODEL_BUCKET}/models/candidate/best/pipeline.pkl,MODEL_VERSION=${GITHUB_SHA}"

      - name: Run Cloud Run smoke test
        continue-on-error: true
        run: |
          SERVICE_URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --format "value(status.url)")

          echo "Cloud Run URL: $SERVICE_URL"

          echo "Testing /health endpoint..."
          echo "Testing /health endpoint..."
          curl -i "$SERVICE_URL/health" || true

          echo "Testing /api/predict endpoint..."
          curl -fsS -X POST "$SERVICE_URL/api/predict" \
            -H "Content-Type: application/json" \
            -d '{"text":"This is a sample news article for fake news detection."}'