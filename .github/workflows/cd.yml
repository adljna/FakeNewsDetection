name: CD - Production Deployment

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  MODEL_BUCKET: ${{ secrets.MODEL_BUCKET }}
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  AR_REPOSITORY: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
  IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Build Docker and Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: github.ref_name == 'master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required environment variables
        run: |
          required_vars=(
            "GCP_PROJECT_ID"
            "GCP_REGION"
            "MODEL_BUCKET"
            "CLOUD_RUN_SERVICE"
            "AR_REPOSITORY"
            "IMAGE_NAME"
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "Missing required environment variable: $var"
              exit 1
            fi
          done

          echo "All required environment variables are set."

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Define Docker image URI
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          IMAGE_URI_LATEST="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPOSITORY}/${IMAGE_NAME}:production-latest"

          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "IMAGE_URI_LATEST=${IMAGE_URI_LATEST}" >> "$GITHUB_ENV"

          echo "Docker image URI: ${IMAGE_URI}"
          echo "Docker image latest URI: ${IMAGE_URI_LATEST}"

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_URI" \
            -t "$IMAGE_URI_LATEST" \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push "$IMAGE_URI"
          docker push "$IMAGE_URI_LATEST"

      - name: Validate best candidate model exists
        run: |
          echo "Checking best candidate model and metrics..."

          gcloud storage ls "gs://${MODEL_BUCKET}/models/candidate/best/pipeline.pkl"
          gcloud storage ls "gs://${MODEL_BUCKET}/reports/candidate/best/metrics.json"

          gcloud storage cp \
            "gs://${MODEL_BUCKET}/reports/candidate/best/metrics.json" \
            best_metrics.json

          python scripts/validate_best_model.py \
            --metrics best_metrics.json \
            --min-f1 $MIN_F1_SCORE

      - name: Promote best candidate model to production
        run: |
          echo "Promoting best candidate model to production..."

          PRODUCTION_MODEL_URI="gs://${MODEL_BUCKET}/models/production/latest/pipeline.pkl"
          PRODUCTION_METRICS_URI="gs://${MODEL_BUCKET}/reports/production/latest/metrics.json"

          VERSIONED_MODEL_URI="gs://${MODEL_BUCKET}/models/production/${GITHUB_SHA}/pipeline.pkl"
          VERSIONED_METRICS_URI="gs://${MODEL_BUCKET}/reports/production/${GITHUB_SHA}/metrics.json"

          gcloud storage cp \
            "gs://${MODEL_BUCKET}/models/candidate/best/pipeline.pkl" \
            "$PRODUCTION_MODEL_URI"

          gcloud storage cp \
            "gs://${MODEL_BUCKET}/reports/candidate/best/metrics.json" \
            "$PRODUCTION_METRICS_URI"

          gcloud storage cp \
            "gs://${MODEL_BUCKET}/models/candidate/best/pipeline.pkl" \
            "$VERSIONED_MODEL_URI"

          gcloud storage cp \
            "gs://${MODEL_BUCKET}/reports/candidate/best/metrics.json" \
            "$VERSIONED_METRICS_URI"

          echo "PRODUCTION_MODEL_URI=${PRODUCTION_MODEL_URI}" >> "$GITHUB_ENV"
          echo "PRODUCTION_METRICS_URI=${PRODUCTION_METRICS_URI}" >> "$GITHUB_ENV"
          echo "VERSIONED_MODEL_URI=${VERSIONED_MODEL_URI}" >> "$GITHUB_ENV"

          echo "Production model promoted to: ${PRODUCTION_MODEL_URI}"
          echo "Versioned production model saved to: ${VERSIONED_MODEL_URI}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --image "$IMAGE_URI" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "MODEL_GCS_URI=${PRODUCTION_MODEL_URI},MODEL_VERSION=${GITHUB_SHA}" \
            --quiet

      - name: Get Cloud Run service URL
        run: |
          SERVICE_URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format "value(status.url)")

          if [ -z "$SERVICE_URL" ]; then
            echo "Failed to get Cloud Run service URL."
            exit 1
          fi

          echo "SERVICE_URL=${SERVICE_URL}" >> "$GITHUB_ENV"
          echo "Cloud Run URL: ${SERVICE_URL}"

      - name: Run Cloud Run smoke test
        run: |
          echo "Testing Cloud Run service readiness..."

          HEALTH_STATUS="000"

          for attempt in {1..12}; do
            echo "Health check attempt ${attempt}/12..."

            HEALTH_STATUS=$(curl -sS -o health_response.json -w "%{http_code}" \
              "$SERVICE_URL/health" || true)

            echo "Health status: ${HEALTH_STATUS}"

            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "Health check passed."
              cat health_response.json
              break
            fi

            sleep 10
          done

          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "Health check failed after multiple attempts."
            cat health_response.json || true
            exit 1
          fi

          echo "Testing /api/predict endpoint..."

          PREDICT_STATUS=$(curl -sS -o predict_response.json -w "%{http_code}" \
            -X POST "$SERVICE_URL/api/predict" \
            -H "Content-Type: application/json" \
            -d '{"text":"This is a sample news article for fake news detection."}')

          echo "Predict status: ${PREDICT_STATUS}"
          cat predict_response.json

          if [ "$PREDICT_STATUS" != "200" ]; then
            echo "Prediction smoke test failed."
            exit 1
          fi

          echo "Prediction smoke test passed."

      - name: Write CD summary
        if: always()
        run: |
          echo "## CD Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${SHORT_SHA:-${GITHUB_SHA}}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Docker image: \`${IMAGE_URI:-not generated}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production model URI: \`${PRODUCTION_MODEL_URI:-not promoted}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versioned model URI: \`${VERSIONED_MODEL_URI:-not created}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Best candidate F1: \`${BEST_F1:-not available}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Best candidate accuracy: \`${BEST_ACCURACY:-not available}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloud Run service: \`${CLOUD_RUN_SERVICE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloud Run URL: \`${SERVICE_URL:-not available}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow status: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This CD promotes the best candidate model to production, builds and pushes a Docker image to Artifact Registry, deploys the Flask API to Cloud Run, and validates the deployment using smoke tests." >> "$GITHUB_STEP_SUMMARY"
